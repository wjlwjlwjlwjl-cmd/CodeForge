server:
    port: 18081

spring:
    application:
        name: code-forge-friend
    profiles:
        active: ${RUN_ENV}
    cloud:
        nacos:
            discovery:
                username: nacos
                password: nacos
                namespace: code-forge-${RUN_ENV}
                server-addr: ${NACOS_ADDR}
            config:
                username: nacos
                password: nacos
                namespace: code-forge-${RUN_ENV}
                server-addr: ${NACOS_ADDR}
                file-extension: yaml
                # 共享配置
                shared-configs:
                    - data-id: share-redis-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
                      refresh: true
                    - data-id: share-mysql-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
                      refresh: true
                    - data-id: share-email-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
                      refresh: true
                    - data-id: share-es-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
                      refresh: true
