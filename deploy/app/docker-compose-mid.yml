#启动命令 docker compose -f docker-compose-mid.yml up -d
services:
  code-forge-mysql:
    container_name: code-forge-mysql
    image: mysql:8.4.2
    ports:
      - "3306:3306"
    volumes:
      - ../data/codeforgedata/mysql/data:/var/lib/mysql
      - ./mysql/sql:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--explicit_defaults_for_timestamp=true',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-ignore-db=mysql',
      '--binlog-cache-size=256M',
      '--binlog-format=ROW',
      '--max_connections=2000'
    ]
    restart: always
    networks:
      - codeforge_network
    healthcheck:
      test: mysql --user=wjl -h127.0.0.1 --password='wjl@123' -e "SELECT 1;"
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: wjl@123
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  code-forge-nacos:
    container_name: code-forge-nacos
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=code-forge-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=frameworkjava_nacos_test
      - MYSQL_SERVICE_USER=wjl
      - MYSQL_SERVICE_PASSWORD=wjl@123
    volumes:
      - ../data/codeforgedata/nacos/logs/:/home/nacos/logs
      - ../data/codeforgedata/nacos/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    restart: always
    networks:
      - codeforge_network
    depends_on:
      code-forge-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10

  code-forge-redis:
    container_name: code-forge-redis
    image: redis:7.0.15
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ../data/codeforgedata/redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - codeforge_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=wjl@123
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -X POST 'http://localhost:9200/_analyze' -H 'Content-Type: application/json' -d '{\"analyzer\":\"smartcn\",\"text\":\"中华人民共和国\"}' | grep -q 'tokens'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - codeforge_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.3
    container_name: kibana
    restart: unless-stopped

    depends_on:
      elasticsearch:
        condition: service_healthy

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "5601:5601"
    networks:
      - codeforge_network
      
volumes:
  es_data:

networks:
  codeforge_network:
