server:
  port: 8080
spring:
  application:
    name: rabbitmq
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: 123
    virtual-host: /
    acknowledge-mode: none
    publisher-confirm-type: correlated # 开启消息发送确认
    retry:
      enabled: true
      initial-interval: 5000ms
      max-attempts: 5